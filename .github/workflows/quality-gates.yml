name: quality-gates

on:
  pull_request:
  workflow_dispatch:

jobs:
  python-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile check
        run: python -m compileall -q run.py app routers core utils cli stats_cli crawlers scripts tests

  desktop-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npm run build
